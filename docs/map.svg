<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000" width="1700" height="1000" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif">
  <title>초크네임 전체 지도</title>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.2 0"/>
    </filter>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf2"/>
      <stop offset="0.65" stop-color="#f8f2e3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f3ead6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0e0"/>
      <stop offset="1" stop-color="#ece0c4"/>
    </linearGradient>
    <linearGradient id="seaShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c1bd"/>
      <stop offset="1" stop-color="#8fa3a0"/>
    </linearGradient>
    <symbol id="mtn" viewBox="0 0 30 22"><path d="M1 21 L12 3 L17 11 L20 7 L29 21 Z" fill="#d9c9a6" stroke="#5b4a33" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="tree" viewBox="0 0 14 18"><path d="M7 1 L12.5 12 H1.5 Z" fill="#8f8a6a" stroke="#3f3a2a" stroke-width="1.1" stroke-linejoin="round"/><path d="M7 12 V17" stroke="#3f3a2a" stroke-width="1.2"/></symbol>
    <symbol id="city" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" fill="#efe3c8" stroke="#3b2e1f" stroke-width="1.6"/><rect x="9" y="2" width="6" height="8" fill="#efe3c8" stroke="#3b2e1f" stroke-width="1.6"/><path d="M7 21 V15 H11 V21" fill="none" stroke="#3b2e1f" stroke-width="1.2"/></symbol>
    <symbol id="town" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#efe3c8" stroke="#3b2e1f" stroke-width="1.6"/><circle cx="7" cy="7" r="1.6" fill="#3b2e1f"/></symbol>
    <symbol id="fading" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#f6f0e0" stroke="#3b2e1f" stroke-width="1.4" stroke-dasharray="4 2.5"/></symbol>
    <symbol id="ghost" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="#9c8a66" stroke-width="1.2" stroke-dasharray="1.5 2.5"/></symbol>
    <symbol id="cave" viewBox="0 0 20 14"><path d="M1 13 Q10 -6 19 13 Z" fill="#d9c9a6" stroke="#3b2e1f" stroke-width="1.4"/><path d="M6 13 Q10 3 14 13 Z" fill="#3b2e1f"/></symbol>
    <symbol id="ship" viewBox="0 0 24 22"><path d="M2 15 H22 L18 21 H6 Z" fill="#d9c9a6" stroke="#3b2e1f" stroke-width="1.3"/><path d="M12 15 V2 L20 13 H12" fill="#efe3c8" stroke="#3b2e1f" stroke-width="1.2"/></symbol>
  </defs>

  <rect width="1700" height="1000" fill="#ece0c4"/>
  <g transform="translate(300 0)">

  <!-- 페일필드 -->
  <path d="M150 260 C260 210 380 215 520 200 C700 185 860 198 980 210 C990 280 960 360 900 420 C800 450 640 440 520 445 C380 450 260 440 170 420 C150 360 140 300 150 260 Z" fill="url(#pale)" filter="url(#rough)"/>
  <text x="450" y="420" text-anchor="middle" font-size="30" fill="#7a6a4a" letter-spacing="10" opacity="0.8">페일필드</text>

  <!-- 바다 -->
  <path d="M-330 -10 L250 -10 L250 0 C232 80 196 160 174 230 C160 280 140 320 124 360 C108 410 112 470 132 520 C150 565 146 610 128 650 C118 680 132 712 150 738 C162 756 168 770 166 782 C160 806 140 830 112 862 C100 890 120 922 158 950 C188 972 214 988 230 1000 L230 1010 L-330 1010 Z" fill="url(#seaShade)" filter="url(#rough)"/>
  <g stroke="#7f9591" stroke-width="1" fill="none" opacity="0.55">
    <path d="M-250 260 C-200 300 -170 360 -160 420"/>
    <path d="M-260 800 C-210 830 -170 870 -150 920"/>
    <path d="M-60 600 C-30 640 -10 680 0 720"/>
  </g>
  <path d="M250 0 C232 80 196 160 174 230 C160 280 140 320 124 360 C108 410 112 470 132 520 C150 565 146 610 128 650 C118 680 132 712 150 738 C162 756 168 770 166 782 C160 806 140 830 112 862 C100 890 120 922 158 950 C188 972 214 988 230 1000" fill="none" stroke="#3b2e1f" stroke-width="2.2" filter="url(#rough)"/>
  <text x="-130" y="520" text-anchor="middle" font-size="38" fill="#43585a" letter-spacing="14" font-style="italic" opacity="0.9">에코 해</text>
  <!-- 울라의 항로 -->
  <path d="M164 800 C100 790 40 740 20 660 C4 560 30 440 50 350 C66 280 100 220 190 120" fill="none" stroke="#45605c" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.85"/>
  <use href="#ship" x="30" y="420" width="22" height="20"/>

  <!-- 블랭크 (안개) -->
  <path d="M-330 -10 L1090 -10 L1090 0 C1094 50 1060 110 1010 150 C950 195 860 192 780 182 C700 172 620 196 540 190 C460 184 380 162 320 160 C250 158 170 176 100 182 C60 186 25 184 0 182 C-100 184 -200 190 -330 188 Z" fill="url(#fog)"/>
  <path d="M-300 190 C-200 190 -100 184 0 182 C25 184 60 186 100 182 C170 176 250 158 320 160 C380 162 460 184 540 190 C620 196 700 172 780 182 C860 192 950 195 1010 150 C1060 110 1094 50 1090 0" fill="none" stroke="#8a7550" stroke-width="1.4" stroke-dasharray="2 7" opacity="0.7"/>
  <text x="690" y="70" text-anchor="middle" font-size="30" fill="#b3a27c" letter-spacing="14">블랭크</text>
  <text x="690" y="98" text-anchor="middle" font-size="13" fill="#a8977a">북쪽의 하얀 안개</text>
  <text x="-120" y="140" text-anchor="middle" font-size="13" fill="#a8977a">북해 (항해 금지)</text>
  <use href="#ghost" x="198" y="96" width="20" height="20"/>
  <text x="208" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#a8977a">나인의 고향?</text>

  <!-- 스파인리지 산맥 -->
  <g>
    <use href="#mtn" x="900" y="600" width="34" height="25"/><use href="#mtn" x="930" y="578" width="30" height="22"/>
    <use href="#mtn" x="962" y="560" width="36" height="27"/><use href="#mtn" x="1000" y="582" width="30" height="22"/>
    <use href="#mtn" x="1030" y="560" width="34" height="25"/><use href="#mtn" x="1066" y="590" width="30" height="22"/>
    <use href="#mtn" x="1096" y="566" width="36" height="27"/><use href="#mtn" x="1134" y="596" width="30" height="22"/>
    <use href="#mtn" x="1164" y="574" width="34" height="25"/><use href="#mtn" x="1200" y="606" width="30" height="22"/>
    <use href="#mtn" x="950" y="628" width="26" height="19"/><use href="#mtn" x="1110" y="632" width="26" height="19"/>
    <use href="#mtn" x="1220" y="640" width="30" height="22"/><use href="#mtn" x="1180" y="660" width="26" height="19"/>
  </g>
  <text x="1080" y="548" text-anchor="middle" font-size="16" fill="#4a3b26" letter-spacing="3">스파인리지 산맥</text>

  <!-- 수트우드 숲 -->
  <g>
    <use href="#tree" x="420" y="800" width="14" height="18"/><use href="#tree" x="440" y="820" width="14" height="18"/>
    <use href="#tree" x="460" y="802" width="14" height="18"/><use href="#tree" x="480" y="826" width="14" height="18"/>
    <use href="#tree" x="500" y="806" width="14" height="18"/><use href="#tree" x="520" y="830" width="14" height="18"/>
    <use href="#tree" x="540" y="808" width="14" height="18"/><use href="#tree" x="560" y="832" width="14" height="18"/>
    <use href="#tree" x="310" y="846" width="14" height="18"/><use href="#tree" x="456" y="852" width="14" height="18"/>
    <use href="#tree" x="490" y="860" width="14" height="18"/><use href="#tree" x="530" y="862" width="14" height="18"/>
    <use href="#tree" x="580" y="812" width="14" height="18"/><use href="#tree" x="600" y="838" width="14" height="18"/>
    <use href="#tree" x="340" y="870" width="14" height="18"/><use href="#tree" x="380" y="840" width="14" height="18"/>
    <use href="#tree" x="620" y="816" width="14" height="18"/><use href="#tree" x="640" y="842" width="14" height="18"/>
  </g>
  <text x="490" y="912" text-anchor="middle" font-size="17" fill="#3f3a2a" letter-spacing="3">수트우드 숲</text>

  <!-- 강과 호수 -->
  <path d="M1076 646 C1000 610 920 560 832 530" fill="none" stroke="#7f9591" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="762" cy="522" rx="72" ry="34" fill="#a9b8b3" stroke="#3b2e1f" stroke-width="1.5" filter="url(#rough)"/>
  <text x="762" y="527" text-anchor="middle" font-size="12" fill="#2f4240" font-style="italic">미러미어 호수</text>
  <path d="M692 530 C640 560 600 600 560 640 C530 670 505 690 470 712 C380 760 260 772 160 776" fill="none" stroke="#7f9591" stroke-width="5" stroke-linecap="round"/>
  <text x="616" y="620" font-size="12" fill="#3b4a48" font-style="italic">드리프트 강</text>

  <!-- 길 -->
  <path d="M470 684 C500 610 590 530 700 496 C720 490 740 486 760 484 C880 440 1030 360 1174 312" fill="none" stroke="#3b2e1f" stroke-width="2.2" stroke-dasharray="9 5"/>
  <path d="M492 708 C640 724 860 730 1040 736" fill="none" stroke="#3b2e1f" stroke-width="2" stroke-dasharray="9 5"/>
  <path d="M458 708 C380 740 280 770 192 800" fill="none" stroke="#3b2e1f" stroke-width="2" stroke-dasharray="9 5"/>
  <!-- 로드워크 길 -->
  <g fill="none" stroke="#6b4b2a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 7">
    <path d="M462 690 C440 600 420 470 404 316"/>
    <path d="M404 316 C340 320 300 328 262 334"/>
    <path d="M404 316 C470 330 520 346 566 354"/>
    <path d="M566 354 C640 330 700 306 762 294"/>
    <path d="M462 690 C440 740 400 780 376 802"/>
  </g>

  <!-- 페일필드 마을 -->
  <use href="#town" x="249" y="327" width="14" height="14"/><text x="256" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2016">프로스트넥</text>
  <use href="#town" x="397" y="309" width="14" height="14"/><text x="404" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2016">트라이포크</text>
  <use href="#town" x="559" y="347" width="14" height="14"/><text x="566" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2016">드라이웰</text>
  <use href="#fading" x="755" y="287" width="14" height="14"/><text x="776" y="298" font-size="13" font-weight="700" fill="#2a2016" opacity="0.6">벨톨</text>

  <!-- 애쉬번 -->
  <g stroke="#6b6158" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M462 680 C456 664 470 654 462 638"/>
    <path d="M482 682 C478 668 490 660 484 646"/>
  </g>
  <use href="#city" x="456" y="684" width="34" height="34"/>
  <text x="440" y="660" text-anchor="end" font-size="20" font-weight="800" fill="#1f1a14">애쉬번</text>
  <text x="440" y="678" text-anchor="end" font-size="11" fill="#4a3b26">시작 도시 · 모험가 길드 본부</text>
  <use href="#town" x="366" y="800" width="12" height="12"/><text x="360" y="811" text-anchor="end" font-size="11" fill="#2a2016">콜리어스 엔드</text>

  <!-- 솔트마우스 -->
  <use href="#city" x="164" y="794" width="28" height="28"/>
  <text x="200" y="836" font-size="16" font-weight="800" fill="#1f1a14">솔트마우스</text>
  <text x="200" y="852" font-size="11" fill="#4a3b26">항구 도시</text>

  <!-- 블랙샤프트 광산 -->
  <use href="#cave" x="1036" y="726" width="24" height="17"/>
  <text x="1066" y="740" font-size="14" font-weight="700" fill="#2a2016">블랙샤프트 광산</text>
  <text x="1066" y="756" font-size="11" fill="#4a3b26">광산 · 고대 유적</text>

  <!-- 아르키움 -->
  <use href="#city" x="1172" y="282" width="34" height="34"/>
  <text x="1214" y="300" font-size="18" font-weight="800" fill="#1f1a14">아르키움</text>
  <text x="1214" y="318" font-size="11" fill="#4a3b26">제국 수도</text>
  <text x="1190" y="450" text-anchor="middle" font-size="24" fill="#6b2a1f" letter-spacing="8" opacity="0.7">아르케 제국</text>

  <!-- 랭크 배지 -->
  <g font-size="11" font-weight="700" fill="#fbf6ea" text-anchor="middle">
    <circle cx="512" cy="672" r="14" fill="#4a4440"/><text x="512" y="676">E</text>
    <circle cx="420" cy="900" r="14" fill="#4a4440"/><text x="420" y="904">E</text>
    <circle cx="178" cy="876" r="14" fill="#1d2b3a"/><text x="178" y="880">D</text>
    <circle cx="1018" cy="716" r="14" fill="#1d2b3a"/><text x="1018" y="720">D</text>
    <circle cx="222" cy="312" r="14" fill="#8a5a2b"/><text x="222" y="316">C</text>
    <circle cx="1189" cy="262" r="14" fill="#7d8288"/><text x="1189" y="266">B</text>
    <circle cx="246" cy="118" r="14" fill="#a07e2c"/><text x="246" y="122">A</text>
  </g>

  <!-- 제목 -->
  <g>
    <rect x="1112" y="22" width="266" height="84" fill="#f4ead3" stroke="#3b2e1f" stroke-width="1.6"/>
    <rect x="1118" y="28" width="254" height="72" fill="none" stroke="#3b2e1f" stroke-width="0.8"/>
    <text x="1245" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#2a2016">초크네임 전체 지도</text>
    <text x="1245" y="86" text-anchor="middle" font-size="12" fill="#4a3b26">제국력 1024년</text>
  </g>

  <!-- 방위표 -->
  <g transform="translate(-230 920)">
    <circle r="26" fill="none" stroke="#2f3f3e" stroke-width="1"/>
    <path d="M0 -34 L6 0 L0 8 L-6 0 Z" fill="#2f3f3e"/>
    <path d="M0 34 L6 0 L0 -8 L-6 0 Z" fill="#efe3c8" stroke="#2f3f3e" stroke-width="1"/>
    <path d="M-30 0 H30" stroke="#2f3f3e" stroke-width="0.8"/>
    <text y="-40" text-anchor="middle" font-size="13" font-weight="700" fill="#22302f">北</text>
  </g>

  <!-- 범례 -->
  <g transform="translate(1080 800)">
    <rect width="304" height="186" fill="#f4ead3" stroke="#3b2e1f" stroke-width="1.4"/>
    <text x="152" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#2a2016">범례</text>
    <g font-size="12" fill="#2a2016">
      <use href="#city" x="14" y="36" width="20" height="20"/><text x="42" y="51">도시</text>
      <use href="#town" x="160" y="40" width="13" height="13"/><text x="182" y="51">마을</text>
      <use href="#fading" x="17" y="64" width="13" height="13"/><text x="42" y="75">사라지는 중인 마을</text>
      <use href="#cave" x="158" y="64" width="19" height="13"/><text x="182" y="75">광산 · 유적</text>
      <path d="M14 96 H36" stroke="#3b2e1f" stroke-width="2.2" stroke-dasharray="9 5"/><text x="42" y="100">길</text>
      <path d="M160 96 H178" stroke="#6b4b2a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 7"/><text x="182" y="100">로드워크 길</text>
      <path d="M14 120 H36" stroke="#45605c" stroke-width="1.6" stroke-dasharray="6 6"/><text x="42" y="124">뱃길</text>
      <path d="M156 113 h22 v14 h-22 z" fill="#f8f2e3" stroke="#8a7550" stroke-dasharray="2 3"/><text x="182" y="124">안개 지역</text>
      <g font-size="9" font-weight="700" fill="#fbf6ea" text-anchor="middle">
        <circle cx="24" cy="152" r="9" fill="#4a4440"/><text x="24" y="155">E</text>
        <circle cx="46" cy="152" r="9" fill="#1d2b3a"/><text x="46" y="155">D</text>
        <circle cx="68" cy="152" r="9" fill="#8a5a2b"/><text x="68" y="155">C</text>
        <circle cx="90" cy="152" r="9" fill="#7d8288"/><text x="90" y="155">B</text>
        <circle cx="112" cy="152" r="9" fill="#a07e2c"/><text x="112" y="155">A</text>
      </g>
      <text x="128" y="156">이 랭크부터 갈 수 있음</text>
    </g>
  </g>

  </g>
  <rect width="1700" height="1000" filter="url(#grain)" pointer-events="none"/>
  <rect x="4" y="4" width="1692" height="992" fill="none" stroke="#3b2e1f" stroke-width="3"/>
</svg>
